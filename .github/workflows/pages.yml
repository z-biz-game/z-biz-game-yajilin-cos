name: Deploy to GitHub Pages

# 触发器：push 到 main 就建房。壳已经落地（index.html + css/ + js/ 从 d535b11 起就在树里），
# 所以这一条不再是「等轮 2」的占位工作流。
# ⚠ 它部署的是**当前 main 的字节**，浏览器闸读的是**当前工作区的字节**。两者之间唯一的桥是
# ci.yml 里那两个 job；Pages 自己不重跑测试，所以 CI 红着推上来的 main 也会被发出去——
# 要「CI 绿了才发」就给仓库加分支保护，或给 deploy job 加 needs。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No bundler: the engine ships plain ES modules, so the site is a file copy.
      #
      # The allowlist is the point. `path: .` would upload the whole repo, and this repo keeps its
      # bench inside the tree: tools/golden.mjs holds certified answers for frozen seeds, and
      # tools/reference.mjs holds a brute-force enumerator. Both are test assets, not product code —
      # answers on a public site are a spoiler and a cheat sheet, and they'd make "the shipped
      # bundle is the tested bundle" unfalsifiable. Only index.html, css/ and js/ are reachable
      # from the page, so only those get copied.
      #
      # Action versions are the ones that actually exist: configure-pages@v5 /
      # upload-pages-artifact@v3 / deploy-pages@v4. The older triple (v3/v1/v2) 404s on the
      # marketplace while the run still reports green.
      - name: Assemble static site
        run: |
          set -eo pipefail
          test -f index.html || { echo '::error::index.html 不在树里——这份名单就没有东西可发'; exit 1; }
          mkdir _site
          cp index.html _site/
          cp -r css js _site/
          # 名单就是产物边界，所以这里按**枚举**判，不按「有没有 tools/ 目录」判：
          # 多一个 *.md、多一个 server.cjs、多一个 package.json 都是同一种事故（答案与门禁
          # 被发到公网上），而只查 tools/ 的话它们都能混过去。
          find _site -type f | sed 's|^_site/||' > _site.list
          awk '{ ok = ($0 == "index.html") || ($0 ~ /^css\//) || ($0 ~ /^js\//); if (ok == 0) { print "名单外的文件进了产物: " $0; bad = 1 } } END { exit (bad == 1) ? 1 : 0 }' _site.list
          echo "产物 $(wc -l < _site.list | tr -d ' ') 个文件：index.html + css/ + js/，没有 tools/、没有 *.md"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
