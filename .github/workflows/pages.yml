name: Deploy to GitHub Pages

# 触发器：push 到 main 就建房。壳已经落地（index.html + css/ + js/ 从 d535b11 起就在树里），
# 所以这一条不再是「等轮 2」的占位工作流。
# ⚠ 它部署的是**当前 main 的字节**，浏览器闸读的是**当前工作区的字节**。两者之间唯一的桥是
# ci.yml 里那两个 job；Pages 自己不重跑测试，所以 CI 红着推上来的 main 也会被发出去——
# 要「CI 绿了才发」就给仓库加分支保护，或给 deploy job 加 needs。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No bundler: the engine ships plain ES modules, so the site is a file copy.
      #
      # The allowlist is the point. `path: .` would upload the whole repo, and this repo keeps its
      # bench inside the tree: tools/golden.mjs holds certified answers for frozen seeds, and
      # tools/reference.mjs holds a brute-force enumerator. Both are test assets, not product code —
      # answers on a public site are a spoiler and a cheat sheet, and they'd make "the shipped
      # bundle is the tested bundle" unfalsifiable. Only index.html, css/ and js/ are reachable
      # from the page, so only those get copied.
      #
      # 拷哪些不写在这里——写在 tools/assemble-site.sh，本地闸与 CI 调同一支脚本。
      # 以前这里是手抄的三行 cp（index.html/css/js），于是页面后来引用的
      # manifest.webmanifest、sw.js、icons/* 全都上不了线：线上 404，而 CI 一路绿，
      # 因为没有任何一步加载过那份产物。服务器、台架、文档、node_modules 仍在 artifact 外面。
      - name: Assemble static site
        run: bash tools/assemble-site.sh _site
      - name: Deploy set gate (checks the very _site about to be uploaded)
        run: node tools/deploy-set.mjs _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
